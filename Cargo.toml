[package]
name = "vizio-ctl"
version = "0.1.0"
edition = "2021"
description = "Control a VIZIO Elevate soundbar over Bluetooth LE from Windows"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "1.2.1"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
] }
